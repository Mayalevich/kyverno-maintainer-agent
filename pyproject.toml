[project]
name = "kyverno-maintainer-agent"
version = "0.1.0"
description = "A prototype of Kyverno's AI Maintainer Assistant: safe, auditable dependency-PR triage."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
